# Configuración del cliente (cliente_clases_componentes.md §7).
# Las rutas son relativas al directorio de trabajo: ejecutar el cliente desde cliente/.

# Servidor al que se conecta (la pantalla de login permite cambiar host:puerto)
servidor.host=127.0.0.1
servidor.puerto=5000
# Hoy solo existe TCP
servidor.protocolo=TCP
# Igual que servidor.maxTramaBytes del servidor (16 MiB)
servidor.maxTramaBytes=16777216

# Tiempo máximo de espera de una respuesta del servidor
peticion.timeoutSegundos=15

# Base H2 local, una por usuario: {codigo} se reemplaza por el código del usuario.
# Para abrir dos veces el mismo usuario en esta máquina, añadir ;AUTO_SERVER=TRUE
h2.url=jdbc:h2:./data/cliente_{codigo}
h2.usuario=sa
h2.clave=

# Conversaciones que se guardan en la caché LRU de la sesión
cache.mensajes.max=500
