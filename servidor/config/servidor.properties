# Transporte
servidor.protocolo=TCP
servidor.puerto=5000
# Cupo GLOBAL de sesiones (un mismo usuario puede ocuparlas todas)
servidor.maxSesiones=10
servidor.maxTramaBytes=16777216
# CONSOLA o ESCRITORIO
servidor.vista=CONSOLA
# Mensajes pendientes por canal antes de cerrar a un cliente lento
sesion.colaSalida=256

# Cola de mensajes entrantes
cola.capacidad=1000
cola.hilosConsumidores=4

# Validación de contenido
mensajes.maxTextoCaracteres=4000
mensajes.maxImagenBytes=5242880

# Archivos
archivos.directorio=./almacen
usuarios.archivoInicial=./config/usuarios.txt

# Caché L1 (Caffeine) y L2 (Redis, opcional)
cache.l1.max=5000
cache.l1.ttlMinutos=10
cache.l2.habilitada=false
redis.host=localhost
redis.puerto=6379
redis.ttlMinutos=60
